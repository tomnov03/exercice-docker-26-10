services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dogsdb
      MYSQL_USER: dogsuser
      MYSQL_PASSWORD: dogspass
    ports:
      - "3306:3306"
    volumes:
      - dogs-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: dogsdb
      DB_USER: dogsuser
      DB_PASSWORD: dogspass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dogs-mysql-data:
